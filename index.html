<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#ffd0e4">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biju Barrocas — Catálogo</title>
  <link rel="icon" type="image/png" href="./img/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #fffafb;
      --pearl: #fbeef3;
      --rose: #f6d3e2;
      --ink: #35102b;
      --muted: #7a5870;
      --brand: #c4166f;
      --brand-d: #9b0f58;
      --on-brand: #fff;
      --gold: #b98a3e;
      --line: #efd5e1;
      --card: #fff;
      --plum: #35102b;
      --on-plum: #fbe9f2;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: Jost, system-ui, sans-serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 120px
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased
    }

    a {
      color: inherit;
      text-decoration: none
    }

    button {
      font: inherit;
      cursor: pointer
    }

    img {
      display: block;
      max-width: 100%
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px
    }

    /* faixa e cabeçalho */
    .topbar {
      background: var(--plum);
      color: var(--on-plum);
      text-align: center;
      font-size: 13px;
      letter-spacing: .03em;
      padding: 9px 16px
    }

    header {
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20
    }

    .head {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 12px 24px;
      max-width: 1240px;
      margin: 0 auto
    }

    .logo {
      grid-column: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      font: 400 44px/1 "Great Vibes", cursive;
      color: var(--brand);
      white-space: nowrap
    }

    .logo img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--gold)
    }

    .search {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 300px;
      border-bottom: 1px solid var(--line);
      color: var(--muted)
    }

    .search:focus-within {
      border-color: var(--brand)
    }

    .search svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      flex: none
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: none;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      padding: 8px 0;
      outline: 0
    }

    .icons {
      grid-column: 3;
      grid-row: 1;
      display: flex;
      gap: 10px;
      justify-self: end
    }

    .ibtn {
      background: none;
      border: 0;
      color: var(--ink);
      position: relative;
      padding: 6px
    }

    .ibtn svg {
      width: 25px;
      height: 25px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6
    }

    .ibtn:hover {
      color: var(--brand)
    }

    .badge {
      position: absolute;
      top: -1px;
      right: -5px;
      background: var(--brand);
      color: var(--on-brand);
      border-radius: 999px;
      font: 600 11px/1 var(--sans);
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 0 0 2px var(--bg)
    }

    nav {
      display: flex;
      gap: 34px;
      justify-content: center;
      padding: 2px 24px 12px;
      font-size: 15px;
      font-weight: 500;
      overflow-x: auto;
      scrollbar-width: none
    }

    nav a {
      position: relative;
      padding: 4px 0;
      white-space: nowrap;
      cursor: pointer
    }

    nav a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: var(--gold);
      transform: scaleX(0);
      transition: transform .25s
    }

    nav a:hover::after,
    nav a.on::after {
      transform: scaleX(1)
    }

    nav a.on {
      color: var(--brand)
    }

    /* hero */
    .hero {
      background: radial-gradient(900px 500px at 85% 40%, var(--rose), transparent 70%), var(--pearl);
      overflow: hidden
    }

    .hero .wrap {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      align-items: center;
      gap: 48px;
      padding-top: 56px;
      padding-bottom: 56px
    }

    .hero h1 {
      font: 600 clamp(48px, 7.4vw, 104px)/.95 var(--serif);
      letter-spacing: -.015em
    }

    .hero h1 em {
      font-weight: 500;
      color: var(--brand)
    }

    .hero p {
      margin: 22px 0 32px;
      color: var(--muted);
      max-width: 40ch;
      font-size: 17px
    }

    .cta {
      display: inline-block;
      background: var(--brand);
      color: var(--on-brand);
      padding: 15px 34px;
      font-weight: 500;
      font-size: 16px;
      border-radius: 999px;
      transition: background .2s
    }

    .cta:hover,
    .cta:focus-visible {
      background: var(--brand-d)
    }

    .arch {
      position: relative;
      justify-self: center;
      width: min(100%, 430px);
      aspect-ratio: 4/5
    }

    .arch::before {
      content: "";
      position: absolute;
      inset: -14px;
      border: 1px solid var(--gold);
      border-radius: 999px 999px 0 0
    }

    .arch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 999px 999px 0 0;
      background: var(--rose)
    }

    .arch .pearl {
      position: absolute;
      left: -34px;
      bottom: 34px;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid var(--pearl);
      box-shadow: 0 10px 30px rgba(53, 16, 43, .22)
    }

    /* benefícios */
    .perks {
      background: var(--bg);
      border-bottom: 1px solid var(--line)
    }

    .perks .wrap {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding-top: 26px;
      padding-bottom: 26px
    }

    .perks div {
      padding: 4px 22px;
      text-align: center;
      border-left: 1px solid var(--line);
      font-size: 14px;
      color: var(--muted)
    }

    .perks div:first-child {
      border-left: 0
    }

    .perks b {
      display: block;
      font: 600 21px/1.2 var(--serif);
      color: var(--ink);
      margin-bottom: 2px
    }

    /* títulos de seção */
    section.blk {
      padding-top: 64px;
      padding-bottom: 8px
    }

    h2 {
      display: flex;
      align-items: baseline;
      gap: 18px;
      font: 600 clamp(30px, 4vw, 44px)/1.1 var(--serif);
      margin-bottom: 28px
    }

    h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
      order: 1;
      align-self: center
    }

    h2 small {
      order: 2;
      font: 400 14px var(--sans);
      color: var(--muted);
      white-space: nowrap
    }

    /* categorias em arco */
    .cats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 14px
    }

    .cat {
      text-align: center;
      font: 600 22px/1.2 var(--serif)
    }

    .cat .circ {
      aspect-ratio: 4/5;
      border-radius: 999px 999px 0 0;
      background: var(--rose) center/cover;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden
    }

    .cat .circ::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgba(185, 138, 62, .0);
      transition: box-shadow .25s
    }

    .cat:hover .circ::after,
    .cat:focus-visible .circ::after {
      box-shadow: inset 0 0 0 3px var(--gold)
    }

    .cat .circ {
      transition: transform .35s
    }

    .cat:hover .circ {
      transform: translateY(-4px)
    }

    /* grades de produtos */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 34px 22px
    }

    .card {
      display: flex;
      flex-direction: column
    }

    .ph {
      position: relative;
      aspect-ratio: 4/5;
      background: var(--rose);
      overflow: hidden;
      border-radius: 6px;
      cursor: zoom-in;
      border: 0;
      padding: 0;
      width: 100%
    }

    .ph::before {
      content: "";
      position: absolute;
      inset: -16px;
      background: var(--bg) center/cover;
      filter: blur(18px);
      opacity: .85
    }

    .ph img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s
    }

    .ph:hover img {
      transform: scale(1.04)
    }

    .info {
      padding: 14px 2px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1
    }

    .nm {
      font: 600 21px/1.2 var(--serif);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.4em
    }

    .old {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.7em
    }

    .pr {
      font-weight: 600;
      font-size: 18px;
      line-height: 1.3;
      min-height: 1.3em;
      color: var(--brand-d)
    }

    .pr small {
      font-weight: 400;
      font-size: 14px;
      color: var(--muted)
    }

    .buy {
      display: block;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      line-height: 1.3;
      margin-top: 12px;
      background: none;
      color: var(--brand);
      border: 1px solid var(--brand);
      padding: 11px;
      font-weight: 500;
      border-radius: 999px;
      transition: background .2s, color .2s
    }

    .buy:hover,
    .buy:focus-visible {
      background: var(--brand);
      color: var(--on-brand)
    }

    .card .info .buy {
      margin-top: auto
    }

    .card .info .pr {
      margin-bottom: 10px
    }

    /* destaques: arte pronta, sem corte */
    .hl-wrap {
      background: var(--pearl);
      margin-top: 64px;
      padding: 8px 0 56px
    }

    .hl {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
      align-items: stretch
    }

    .hcard {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .hcard .im {
      display: block;
      position: relative;
      width: 100%;
      aspect-ratio: 4/5;
      overflow: hidden;
      border: 0;
      padding: 0;
      background: var(--rose);
      cursor: zoom-in
    }

    .hcard .im::before {
      content: "";
      position: absolute;
      inset: -16px;
      background: var(--bg) center/cover;
      filter: blur(18px);
      opacity: .85
    }

    .hcard .im img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain
    }

    .hcard .info {
      padding: 16px;
      flex: 1
    }

    .hcard .info .buy {
      margin-top: auto
    }

    .hcard .info .pr {
      margin-bottom: 10px
    }

    .empty {
      padding: 60px 0;
      text-align: center;
      color: var(--muted)
    }

    /* ampliar foto */
    dialog {
      border: 0;
      background: none;
      padding: 0;
      max-width: none;
      max-height: none;
      width: 100%;
      height: 100%;
      color: var(--on-plum)
    }

    dialog::backdrop {
      background: rgba(26, 8, 21, .88)
    }

    .lb {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 28px;
      align-items: center;
      height: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px
    }

    .lb img {
      max-width: 100%;
      max-height: calc(100vh - 48px);
      margin: 0 auto;
      border-radius: 6px;
      object-fit: contain
    }

    .lb h3 {
      font: 600 32px/1.1 var(--serif);
      margin-bottom: 6px
    }

    .lb .pr {
      color: var(--on-plum);
      margin: 10px 0 18px
    }

    .lb .pr small {
      color: var(--rose)
    }

    .lb .old {
      color: var(--rose)
    }

    .lb .buy {
      width: 100%;
      background: var(--brand);
      color: #fff;
      border-color: var(--brand)
    }

    .lb .buy:hover {
      background: var(--brand-d);
      border-color: var(--brand-d)
    }

    .x {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: 0;
      color: #fff;
      font-size: 34px;
      line-height: 1;
      padding: 6px 12px
    }


    /* sacola */
    #bag {
      position: fixed;
      inset: 0 0 0 auto;
      margin: 0;
      width: min(440px, 100vw);
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      box-shadow: -20px 0 50px rgba(26, 8, 21, .35)
    }

    #bag::backdrop {
      background: rgba(26, 8, 21, .6)
    }

    #bag[open] {
      display: flex;
      flex-direction: column
    }

    .bag-h {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line)
    }

    .bag-h h3 {
      font: 600 28px/1 var(--serif)
    }

    .bag-h .x {
      position: static;
      color: var(--ink);
      padding: 0 6px
    }

    .bag-l {
      flex: 1;
      overflow: auto;
      padding: 8px 20px
    }

    .bi {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line)
    }

    .bi img {
      width: 72px;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      background: var(--rose)
    }

    .bi .t {
      font: 600 17px/1.2 var(--serif)
    }

    .bi .u {
      font-size: 14px;
      color: var(--muted);
      margin-top: 2px
    }

    .bi .q {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px
    }

    .bi .q button {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--brand);
      background: none;
      color: var(--brand);
      font-size: 18px;
      line-height: 1;
      display: grid;
      place-items: center;
      padding: 0
    }

    .bi .q b {
      min-width: 20px;
      text-align: center
    }

    .bi .q .rm {
      width: auto;
      border: 0;
      border-radius: 0;
      font-size: 13px;
      margin-left: auto;
      text-decoration: underline;
      color: var(--muted)
    }

    .bag-f {
      padding: 16px 20px calc(18px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line);
      background: var(--card)
    }

    .bag-f .tt {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 19px
    }

    .bag-f .nt {
      font-size: 13px;
      color: var(--muted);
      margin: 4px 0 12px
    }

    .bag-f .buy {
      margin-top: 8px;
      background: var(--brand);
      color: #fff
    }

    .bag-f .buy:hover {
      background: var(--brand-d)
    }

    .bag-f .clr {
      background: none;
      border: 0;
      color: var(--muted);
      text-decoration: underline;
      font-size: 13px;
      width: 100%;
      margin-top: 10px
    }

    .bag-e {
      padding: 48px 0;
      text-align: center;
      color: var(--muted)
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translate(-50%, 20px);
      background: var(--plum);
      color: var(--on-plum);
      padding: 11px 20px;
      border-radius: 999px;
      font-size: 15px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 50
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .ibtn.bump svg {
      animation: bump .4s
    }

    @keyframes bump {
      40% {
        transform: scale(1.25)
      }
    }

    .lb .wa2 {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: var(--on-plum);
      font-size: 14px;
      text-decoration: underline
    }

    /* rodapé */
    footer {
      margin-top: 80px;
      background: var(--plum);
      color: var(--on-plum);
      padding: 56px 0 40px;
      border-top: 3px solid var(--gold)
    }

    footer .wrap {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1.2fr;
      gap: 40px;
      font-size: 15px
    }

    footer .logo {
      font-size: 46px;
      color: #f6a6cf;
      display: block
    }

    footer h3 {
      font: 600 22px var(--serif);
      margin-bottom: 12px;
      color: #f3d9a8
    }

    footer li {
      list-style: none;
      margin: 7px 0
    }

    footer ul {
      padding: 0
    }

    footer a:hover {
      color: #f3d9a8
    }

    footer p {
      color: #e7c9da
    }

    .wpp {
      position: fixed;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #25d366;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .28);
      z-index: 30;
      transition: transform .2s
    }

    .wpp:hover {
      transform: scale(1.07)
    }

    .wpp svg {
      width: 31px;
      height: 31px;
      fill: #fff
    }

    :focus-visible {
      outline: 3px solid var(--brand);
      outline-offset: 3px
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto !important
      }
    }

    @media(max-width:1000px) {

      .grid,
      .hl {
        grid-template-columns: repeat(3, 1fr)
      }

      .cats {
        grid-template-columns: repeat(3, 1fr)
      }
    }

    @media(max-width:760px) {
      .wrap {
        padding: 0 16px
      }

      .head {
        grid-template-columns: 1fr auto;
        gap: 10px 12px;
        padding: 10px 16px
      }

      .logo {
        grid-column: 1;
        font-size: 36px
      }

      .logo img {
        width: 46px;
        height: 46px
      }

      .icons {
        grid-column: 2
      }

      .search {
        grid-column: 1/-1;
        grid-row: 2;
        max-width: none
      }

      nav {
        justify-content: flex-start;
        gap: 24px;
        padding: 2px 16px 10px
      }

      .hero .wrap {
        grid-template-columns: 1fr;
        gap: 44px;
        padding-top: 36px;
        padding-bottom: 48px
      }

      .arch {
        width: min(78%, 340px)
      }

      .arch .pearl {
        width: 96px;
        height: 96px;
        left: -18px
      }

      .perks .wrap {
        grid-template-columns: 1fr 1fr;
        row-gap: 18px
      }

      .perks div:nth-child(3) {
        border-left: 0
      }

      section.blk {
        padding-top: 48px
      }

      .grid,
      .hl {
        grid-template-columns: repeat(2, 1fr);
        gap: 26px 14px
      }

      .cats {
        grid-template-columns: repeat(2, 1fr);
        gap: 16px
      }

      .nm {
        font-size: 18px
      }

      .lb {
        grid-template-columns: 1fr;
        gap: 14px;
        align-content: center;
        padding: 56px 16px 16px
      }

      .lb img {
        max-height: 62vh
      }

      footer .wrap {
        grid-template-columns: 1fr
      }
    }

    .natal-wrap {
      background: linear-gradient(180deg, #fff0f0, var(--bg));
      margin-top: 56px;
      padding: 4px 0 52px;
      border-top: 3px solid #c8102e
    }

    .natal-wrap h2::before {
      content: "✦";
      color: #c8102e;

      {cat: "Cabelo", nome: "Xuxinha e presilha lilás", preco: 7.99, img: "img/xuxinha-lilas.jpg", pos: "50% 85%"},
      {cat: "Bolsas", nome: "Bag ombro a ombro com corretinha", info: "Branca e rosa", preco: 34.99, fit: "contain", img: "img/bag-ombro-corretinha.jpg"},
      {cat: "Bolsas", nome: "Bag ombro a ombro lilás", info: "Alça de ombro", preco: 39.99, fit: "contain", img: "img/bag-ombro-lilas.jpg"},
      {cat: "Pijamas", nome: "Baby doll canelado bege", info: "Tamanho GG", preco: 34.99, fit: "contain", img: "img/baby-doll-bege-gg.jpg"},
      {cat: "Pijamas", nome: "Baby doll canelado branco", info: "Tamanho M", preco: 34.99, fit: "contain", img: "img/baby-doll-branco-m.jpg"},
      {cat: "Pijamas", nome: "Short baby doll canelado verde", info: "Tamanho P", preco: 34.99, fit: "contain", img: "img/short-baby-doll-verde-p.jpg"},
      {cat: "Biquínis", nome: "Biquíni canelado branco", info: "Top cortininha e calcinha com amarração · M e G", preco: 35.00, fit: "contain", img: "img/biquini-canelado-branco.jpg"},
      {cat: "Biquínis", nome: "Biquíni canelado verde", info: "Top cortininha e calcinha com amarração · M e G", preco: 35.00, fit: "contain", img: "img/biquini-canelado-verde.jpg"},
      {cat: "Biquínis", nome: "Biquíni canelado vinho", info: "Top cortininha e calcinha com amarração · tamanho G", preco: 34.99, fit: "contain", img: "img/biquini-canelado-vinho.jpg"},
      {cat: "Maquiagem", nome: "Blush líquido Labranche", info: "Pêssego, rosé, pink ou nude", preco: null, fit: "contain", img: "img/blush-labranche.jpg"},
      {cat: "Maquiagem", nome: "Paleta de pincéis com espelho", info: "Compacta, espelho integrado", preco: 19.99, fit: "contain", img: "img/pinceis-paleta-espelho.jpg"},
      {cat: "Maquiagem", nome: "Kit de pincéis para maquiagem", info: "Cerdas macias, verde ou lilás", preco: 24.99, fit: "contain", img: "img/pinceis-kit-maquiagem.jpg"},
      {cat: "Maquiagem", nome: "Máscara de cílios à prova d’água", info: "T&G Tango, 15 g", preco: 17.99, fit: "contain", img: "img/rimel-tango-arte.jpg"},
      {cat: "Maquiagem", nome: "Lápis de boca Trui Lips tons 1, 4, 7 e 12", info: "Marrons · contorno labial", preco: 11.99, fit: "contain", img: "img/lapis-trui-lips-1-4-7-12.jpg"},
      {cat: "Maquiagem", nome: "Lápis de boca Trui Lips tons 2, 3, 5 e 6", info: "Vermelhos, marrom e rosa · contorno labial", preco: 11.99, fit: "contain", img: "img/lapis-trui-lips-2-3-5-6.jpg"},
      {cat: "Maquiagem", nome: "Lápis de boca Trui Lips tons 8, 9, 10 e 11", info: "Rosa, vinho e marrom · contorno labial", preco: 11.99, fit: "contain", img: "img/lapis-trui-lips-8-9-10-11.jpg"},
      {cat: "Maquiagem", nome: "Delineador Shine’s Carbon Black", info: "Preto intenso, não transfere · 3 mL", preco: 17.99, fit: "contain", img: "img/delineador-shines-carbon-black.jpg"},
    ];
    /* NATAL: seção própria na loja. */
    const NATAL = [
      {cat: "Natal", nome: "Estrelinhas de cabelo de Natal", info: "Vermelha, verde, azul, rosa e lilás · a unidade", preco: 1.00, img: "img/natal-estrelinhas-cores.jpg"},
      {cat: "Natal", nome: "Estrelinhas de cabelo para pet", info: "Deixe seu pet fofo no Natal · a unidade", preco: 1.00, img: "img/natal-estrelinhas-pet.jpg"},
      {cat: "Natal", nome: "Estrelinhas de cabelo mãe e filha", info: "O acessório de Natal · a unidade", preco: 1.00, img: "img/natal-estrelinhas-mae-filha.jpg"}
    ];
    const BQ_BANNER = "img/biquinis-banner.jpg";
    /* ===== FIM DA CONFIGURAÇÃO ===== */

    const $ = s => document.querySelector(s);
    const brl = n => n.toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
    const IMGS = {};
    const thumb = s => IMGS[s] || s;
    const AR = {"img/baby-doll-bege-gg.jpg": 0.667, "img/baby-doll-branco-m.jpg": 0.667, "img/bag-ombro-corretinha.jpg": 0.562, "img/bag-ombro-lilas.jpg": 0.562, "img/biquini-canelado-branco.jpg": 0.8333, "img/biquini-canelado-verde.jpg": 0.8333, "img/biquini-canelado-vinho.jpg": 0.8003, "img/biquinis-banner.jpg": 1.0, "img/blush-labranche.jpg": 1.0, "img/bolsa-corrente.jpg": 1.0122, "img/brinco-losango-dourado.jpg": 0.932, "img/brinco-trevo-dourado.jpg": 0.932, "img/cat-biquini.jpg": 0.8, "img/cat-brincos.jpg": 1.0, "img/cat-conjuntos.jpg": 1.0, "img/cat-natal.jpg": 1.0, "img/cat-pet.jpg": 1.0, "img/cat-pijamas.jpg": 1.0, "img/colar-flor-detalhe.jpg": 0.7574, "img/colar-flor-madreperola.jpg": 0.7521, "img/colar-folheado.jpg": 1.0, "img/colar-trevo.jpg": 0.6687, "img/conjunto-cifrao.jpg": 0.914, "img/conjunto-coracao-gravado.jpg": 0.667, "img/conjunto-coracao-trevinhos.jpg": 0.914, "img/conjunto-coracao.jpg": 0.914, "img/conjunto-estrela.jpg": 0.8, "img/conjunto-golfinho.jpg": 0.914, "img/conjunto-infinito-simbolo.jpg": 0.914, "img/conjunto-infinito.jpg": 0.914, "img/conjunto-mapa-estrelas.jpg": 0.914, "img/conjunto-trevo.jpg": 0.914, "img/corrente-dourada-316l.jpg": 0.5625, "img/corrente-prata-925.jpg": 0.5625, "img/delineador-shines-carbon-black.jpg": 0.6687, "img/destaque-brinco-coracao-duplo.jpg": 0.8006, "img/destaque-coracoes-dourados.jpg": 0.8, "img/destaque-garra-flor.jpg": 0.797, "img/destaque-garra-g.jpg": 0.9191, "img/destaque-tag-pet.jpg": 0.914, "img/destaque-tiaras-perolas.jpg": 0.936, "img/gelatina-3em1-cachos.jpg": 0.6669, "img/lapis-trui-lips-1-4-7-12.jpg": 0.5644, "img/lapis-trui-lips-2-3-5-6.jpg": 0.5625, "img/lapis-trui-lips-8-9-10-11.jpg": 0.565, "img/logo.jpg": 1.0, "img/natal-estrelinhas-cores.jpg": 1.0, "img/natal-estrelinhas-mae-filha.jpg": 0.9139, "img/natal-estrelinhas-pet.jpg": 1.0, "img/pinceis-kit-maquiagem.jpg": 0.914, "img/pinceis-paleta-espelho.jpg": 0.833, "img/presilha-laco-perolas.jpg": 0.8, "img/presilha-perolas-variadas.jpg": 0.914, "img/pulseira-aco-corda-dourada.jpg": 0.4612, "img/pulseira-aco-prata.jpg": 0.4612, "img/pulseira-coracoes.jpg": 0.8004, "img/pulseira-cristais.jpg": 0.8005, "img/pulseira-flecha.jpg": 0.8004, "img/rimel-tango-arte.jpg": 0.914, "img/rimel-tango.jpg": 0.5737, "img/short-baby-doll-verde-p.jpg": 0.562, "img/xuxinha-azul.jpg": 0.53, "img/xuxinha-kit-3-cores.jpg": 0.5625, "img/xuxinha-lilas.jpg": 0.5756, "img/xuxinha-rosa.jpg": 0.4612};
    const ar = s => AR[s] || 0.8;
    const TODOS = [...DESTAQUES, ...PRODUTOS, ...NATAL];
    let carrinho = 0, CAT = "", TERM = "";

    $("#topbar").textContent = LOJA.faixa;
    $("#logo").textContent = $("#flogo").textContent = LOJA.nome;
    $("#hTitle").innerHTML = LOJA.banner.titulo;
    $("#hText").textContent = LOJA.banner.texto;
    $("#hImg").innerHTML = `<img src="${thumb(LOJA.banner.img)}" alt="" fetchpriority="high">` + (LOJA.banner.img2 ? `<img class="pearl" src="${thumb(LOJA.banner.img2)}" alt="">` : "");
    $("#perks").innerHTML = LOJA.beneficios.map(b => `<div><b>${b[0]}</b>${b[1]}</div>`).join("");
    $("#horario").textContent = LOJA.horario;
    $("#contato").innerHTML = LOJA.contato;
    $("#wpp").href = "https://wa.me/" + LOJA.whatsapp;
    $("#menu").innerHTML = `<a data-cat="">Todos</a>` + CATEGORIAS.map(c => `<a data-cat="${c.nome}">${c.nome}</a>`).join("");

    function preco(p) {
      if (p.preco == null) return `<div class="pr"><small>Consulte o valor</small></div>`;
      return `<div class="pr">${brl(p.preco)}</div>`;
    }
    function waLink(p) {
      const t = "Tenho interesse em: " + p.nome + (p.preco == null ? "" : " (" + brl(p.preco) + ")");
      return `https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent("Olá! " + t)}`;
    }
    function btn(p) {
      return `<button class="buy" type="button" data-add="${TODOS.indexOf(p)}">Adicionar à sacola</button>`;
    }
    function btnOld(p) {
      const t = p.preco == null ? "Tenho interesse em: " + p.nome : "Tenho interesse em: " + p.nome + " (" + brl(p.preco) + ")";
      return `<a class="buy" href="https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent("Olá! " + t)}" target="_blank" rel="noopener noreferrer">${p.preco == null ? "Consultar" : "Comprar"}</a>`;
    }
    function card(p) {
      return `<article class="card"><button class="ph" style="--bg:url('${thumb(p.img)}')${p.fit === "contain" ? ";aspect-ratio:" + ar(p.img) : ""}" data-zoom="${TODOS.indexOf(p)}" aria-label="Ampliar foto: ${p.nome}">
    <img src="${thumb(p.img)}" alt="${p.nome}" style="object-position:${p.pos || "50% 50%"};object-fit:${p.fit || "cover"}" loading="lazy" decoding="async" onerror="this.remove()"></button>
    <div class="info"><div class="nm">${p.nome}</div>${`<div class="old">${p.info || "&nbsp;"}</div>`}${preco(p)}${btn(p)}</div></article>`;
    }
    function hcard(p) {
      return `<article class="hcard"><button class="im" style="--bg:url('${thumb(p.img)}');aspect-ratio:${ar(p.img)}" data-zoom="${TODOS.indexOf(p)}" aria-label="Ampliar foto: ${p.nome}">
    <img src="${thumb(p.img)}" alt="${p.nome}" loading="lazy" decoding="async" onerror="this.remove()"></button>
    <div class="info"><div class="nm">${p.nome}</div><div class="old">${p.info || "&nbsp;"}</div>${preco(p)}${btn(p)}</div></article>`;
    }
    function render() {
      const f = TERM.toLowerCase().trim();
      const ok = p => (!CAT || p.cat === CAT) && p.nome.toLowerCase().includes(f);
      const n = l => `${l.length} ${l.length > 1 ? "peças" : "peça"}`;
      let html = "", total = 0;
      const nt = NATAL.filter(ok);
      total += nt.length;
      if (nt.length) html += `<div class="natal-wrap" id="natal"><section class="blk wrap"><h2>Natal<small>${n(nt)}</small></h2><div class="hl three">${nt.map(hcard).join("")}</div></section></div>`;
      const hl = DESTAQUES.filter(ok);
      total += hl.length;
      if (hl.length) html += `<div class="hl-wrap"><section class="blk wrap"><h2>Destaques<small>${n(hl)}</small></h2><div class="hl">${hl.map(hcard).join("")}</div></section></div>`;
      [...new Set(PRODUTOS.map(p => p.cat))].forEach(c => {
        const l = PRODUTOS.filter(p => p.cat === c && ok(p));
        total += l.length;
        const ban = c === "Biquínis" ? `<div class="bq-banner"><img src="${thumb(BQ_BANNER)}" alt="Biquínis, moda praia e intimates" loading="lazy" decoding="async"></div>` : "";
        if (l.length) html += `<section class="blk wrap" id="cat-${c}"><h2>${c}<small>${n(l)}</small></h2>${ban}<div class="grid">${l.map(card).join("")}</div></section>`;
      });
      $("#produtos").innerHTML = total ? html : `<div class="wrap"><p class="empty">Nenhum produto encontrado. Tente outra palavra ou escolha uma categoria.</p></div>`;
      document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.cat === CAT));
    }
    render();

    const lb = $("#lb");
    function abrir(i) {
      const p = TODOS[i];
      $("#lbc").innerHTML = `<img src="${thumb(p.img)}" alt="${p.nome}"><div><h3>${p.nome}</h3>${p.info ? `<div class="old">${p.info}</div>` : ""}${preco(p)}${btn(p)}<a class="wa2" href="${waLink(p)}" target="_blank" rel="noopener noreferrer">Perguntar sobre este produto no WhatsApp</a></div>`;
      lb.showModal();
    }
    $("#lbx").onclick = () => lb.close();
    lb.addEventListener("click", e => {if (e.target === lb) lb.close();});

    const campoBusca = $("#q");
    if (campoBusca) campoBusca.addEventListener("input", e => {TERM = e.target.value; render();});
    /* ===== sacola ===== */
    let SACOLA = [];
    try {SACOLA = JSON.parse(localStorage.getItem("bb_sacola") || "[]");} catch (_) { }
    SACOLA = SACOLA.filter(i => TODOS.some(p => p.nome === i.n) && i.q > 0);
    const bag = $("#bag");
    const salvar = () => {try {localStorage.setItem("bb_sacola", JSON.stringify(SACOLA));} catch (_) { } };
    const prod = n => TODOS.find(p => p.nome === n);
    let tt;
    function aviso(m) {const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1800);}
    function pintaSacola() {
      const qtd = SACOLA.reduce((s, i) => s + i.q, 0);
      $("#cartN").textContent = qtd;
      const L = $("#bagL"), F = $("#bagF");
      if (!SACOLA.length) {
        L.innerHTML = `<div class="bag-e">Sua sacola está vazia.<br>Escolha uma peça e toque em “Adicionar à sacola”.</div>`;
        F.innerHTML = "";
        return;
      }
      L.innerHTML = SACOLA.map(i => {
        const p = prod(i.n); return `<div class="bi"><img src="${thumb(p.img)}" alt="" style="object-position:${p.pos || "50% 50%"}">
    <div><div class="t">${p.nome}</div><div class="u">${p.preco == null ? "Consulte o valor" : brl(p.preco)}</div>
    <div class="q"><button type="button" data-q="-1" data-n="${encodeURIComponent(p.nome)}" aria-label="Diminuir">−</button><b>${i.q}</b><button type="button" data-q="1" data-n="${encodeURIComponent(p.nome)}" aria-label="Aumentar">+</button><button type="button" class="rm" data-q="rm" data-n="${encodeURIComponent(p.nome)}">Remover</button></div></div></div>`;
      }).join("");
      const comPreco = SACOLA.filter(i => prod(i.n).preco != null);
      const semPreco = SACOLA.filter(i => prod(i.n).preco == null);
      const total = comPreco.reduce((s, i) => s + prod(i.n).preco * i.q, 0);
      let msg = "Olá! Gostaria de fazer este pedido:\n\n" + SACOLA.map(i => {const p = prod(i.n); return "• " + i.q + "x " + p.nome + (p.preco == null ? " (consultar valor)" : " — " + brl(p.preco * i.q));}).join("\n");
      if (comPreco.length) msg += "\n\nTotal das peças com valor: " + brl(total);
      if (semPreco.length) msg += "\nPeças a consultar: " + semPreco.length;
      F.innerHTML = `<div class="tt"><span>Total</span><span>${comPreco.length ? brl(total) : "a consultar"}</span></div>
    <div class="nt">${semPreco.length ? "Peças sem valor (" + semPreco.length + ") serão confirmadas no WhatsApp." : "Frete e pagamento combinados no WhatsApp."}</div>
    <a class="buy" id="fin" href="https://wa.me/${LOJA.whatsapp}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener noreferrer">Finalizar pelo WhatsApp</a>
    <button type="button" class="clr" data-q="clr">Esvaziar sacola</button>`;
    }
    function add(i) {
      const p = TODOS[i], it = SACOLA.find(x => x.n === p.nome);
      if (it) it.q++; else SACOLA.push({n: p.nome, q: 1});
      salvar(); pintaSacola(); bag.showModal(); aviso("Adicionado à sacola");
      const b = $("#bagBtn"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump");
    }
    $("#bagBtn").addEventListener("click", () => {pintaSacola(); bag.showModal();});
    $("#bagx").addEventListener("click", () => bag.close());
    bag.addEventListener("click", e => {if (e.target === bag) bag.close();});
    pintaSacola();

    document.addEventListener("click", e => {
      const a = e.target.closest("[data-add]");
      if (a) {add(+a.dataset.add); return;}
      const q = e.target.closest("[data-q]");
      if (q) {
        if (q.dataset.q === "clr") SACOLA = [];
        else {
          const n = decodeURIComponent(q.dataset.n), it = SACOLA.find(x => x.n === n);
          if (it) {if (q.dataset.q === "rm") it.q = 0; else it.q += +q.dataset.q;}
          SACOLA = SACOLA.filter(x => x.q > 0);
        }
        salvar(); pintaSacola(); return;
      }
      const z = e.target.closest("[data-zoom]");
      if (z) {abrir(+z.dataset.zoom); return;}
      const c = e.target.closest("[data-cat]");
      if (c) {CAT = c.dataset.cat; render(); $("#produtos").scrollIntoView({behavior: "smooth"}); return;}
    });
    document.addEventListener("keydown", e => {if (e.key === "Enter" && e.target.matches(".cat")) e.target.click();});
  </script>
</body>
